name: Release

# v1.2.3 のようなタグを push すると、Developer ID 署名・公証済みの zip / dmg を GitHub Releases に上げ、
# 正式版なら Homebrew tap の Cask も更新する
# 必要な Secrets と手順は docs/release.md を参照
on:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # CI と揃える
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
      APP_NAME: EisuKanaSwitch
      ARTIFACT_NAME: EisuKanaSwitch
    steps:
      - uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::タグは v1.2.3 / v1.2.3-beta.1 の形式にしてください: $TAG"
            exit 1
          fi
          # CFBundleShortVersionString には数字とドットしか入れられないので、プレリリースの接尾辞は落とす
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "MARKETING_VERSION=${VERSION%%-*}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      # 証明書は使い捨てのキーチェーンに入れ、ジョブの最後に消す
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"

          echo -n "$CERTIFICATE_P12_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          rm "$CERTIFICATE_PATH"

          # Team ID は証明書の名前「Developer ID Application: 名前 (TEAMID)」から取り出す
          IDENTITY_LINE="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -n 1)"
          if [[ -z "$IDENTITY_LINE" ]]; then
            echo "::error::Developer ID Application 証明書が見つかりません"
            exit 1
          fi
          echo "$IDENTITY_LINE"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "SIGNING_IDENTITY=$(echo "$IDENTITY_LINE" | awk '{print $2}')" >> "$GITHUB_ENV"
          echo "TEAM_ID=$(echo "$IDENTITY_LINE" | sed -E 's/.*\(([A-Z0-9]{10})\)".*/\1/')" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project EisuKanaSwitch.xcodeproj \
            -scheme EisuKanaSwitch \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH --timestamp"

      - name: Export
        run: |
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$EXPORT_OPTIONS" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Developer ID Application</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$EXPORT_OPTIONS"

          APP_PATH="$RUNNER_TEMP/export/$APP_NAME.app"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Prepare notarytool credentials
        env:
          API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo -n "$API_KEY_P8_BASE64" | base64 --decode -o "$API_KEY_PATH"
          echo "API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"

      # 中の .app を公証・staple してから zip / dmg に詰める
      - name: Notarize app and create zip
        env:
          API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          mkdir -p dist
          SUBMIT_ZIP="$RUNNER_TEMP/notarize.zip"
          ditto -c -k --keepParent "$APP_PATH" "$SUBMIT_ZIP"
          xcrun notarytool submit "$SUBMIT_ZIP" \
            --key "$API_KEY_PATH" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" \
            --wait --timeout 30m
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"

          ditto -c -k --keepParent "$APP_PATH" "dist/$ARTIFACT_NAME-$VERSION.zip"

      - name: Create, sign and notarize dmg
        env:
          API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          DMG_ROOT="$RUNNER_TEMP/dmg"
          DMG_PATH="dist/$ARTIFACT_NAME-$VERSION.dmg"
          mkdir -p "$DMG_ROOT"
          ditto "$APP_PATH" "$DMG_ROOT/$APP_NAME.app"
          ln -s /Applications "$DMG_ROOT/Applications"
          hdiutil create -volname "EisuKana Switch" -srcfolder "$DMG_ROOT" -ov -format UDZO "$DMG_PATH"

          codesign --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" --timestamp "$DMG_PATH"

          xcrun notarytool submit "$DMG_PATH" \
            --key "$API_KEY_PATH" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" \
            --wait --timeout 30m
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG_PATH"

      # Homebrew Cask の sha256 に使う
      - name: Write checksums
        working-directory: dist
        run: shasum -a 256 * | tee SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            $PRERELEASE_FLAG

      # 正式版のときだけ、tap の Cask を新しいバージョンと zip の sha256 に書き換える
      - name: Update Homebrew Cask
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          SHA256="$(shasum -a 256 "dist/$ARTIFACT_NAME-$VERSION.zip" | awk '{print $1}')"
          TAP_DIR="$RUNNER_TEMP/homebrew-tap"
          CASK_PATH="Casks/eisukana-switch.rb"

          gh auth setup-git
          git clone --depth 1 https://github.com/HaruhikoMotokawa/homebrew-tap.git "$TAP_DIR"
          cd "$TAP_DIR"
          sed -i '' -E \
            -e "s/^  version \".*\"$/  version \"$VERSION\"/" \
            -e "s/^  sha256 \".*\"$/  sha256 \"$SHA256\"/" \
            "$CASK_PATH"
          git diff

          if git diff --quiet; then
            echo "Cask は更新済み"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "eisukana-switch $VERSION"
          git push

      - name: Clean up
        if: always()
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP/AuthKey.p8"
